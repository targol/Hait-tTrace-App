name: Android APK (Capacitor)

on:
  push:
    branches: [ main, master, 'feat/**', 'fix/**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app
        run: npm --prefix web run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Read version
        id: ver
        run: |
          NAME=$(grep -m1 "currentVersion:" web/src/version.ts | sed -E "s/.*'([^']+)'.*/\1/")
          CODE=$(grep -m1 "currentVersionCode:" web/src/version.ts | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Version $NAME ($CODE)"

      - name: Prepare signing key
        id: sign
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "task=assembleRelease" >> "$GITHUB_OUTPUT"
            echo "out=release/app-release.apk" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Signing secrets not set - building DEBUG APK. Its signature differs from the release key, so updating over a release install requires uninstall. See docs/ANDROID_BUILD.md"
            echo "task=assembleDebug" >> "$GITHUB_OUTPUT"
            echo "out=debug/app-debug.apk" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        working-directory: android
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew ${{ steps.sign.outputs.task }} --no-daemon \
            -PappVersionCode=${{ steps.ver.outputs.code }} \
            -PappVersionName=${{ steps.ver.outputs.name }}

      - name: Collect APK
        run: |
          mkdir -p out
          cp "android/app/build/outputs/apk/${{ steps.sign.outputs.out }}" out/Javaneh-${{ steps.ver.outputs.name }}.apk
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: Javaneh-APK
          path: out/*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
